server {
    listen 80;
    listen [::]:80;
    server_name www.antifake.io.vn;

    return 301 https://antifake.io.vn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name antifake.io.vn;

    root /var/www/antifake/anti-fake-front-end/dist;
    index index.html;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|mjs|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
