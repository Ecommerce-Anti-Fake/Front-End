name: UAT demo visual capture

on:
  workflow_dispatch:
  push:
    branches:
      - uat-capture

permissions:
  contents: read

concurrency:
  group: antifake-uat-visual-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture UAT demo fixture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    env:
      ANTIFAKE_CURRENT_ENVIRONMENT: UAT_DEMO
      UAT_APPROVED_PUBLIC_HOSTS: antifake.io.vn,www.antifake.io.vn
      UAT_BASE_URL: https://antifake.io.vn
      UAT_FIXTURE_SMOKE: "true"
      UAT_USER_EMAIL: ${{ secrets.UAT_USER_EMAIL }}
      UAT_SELLER_EMAIL: ${{ secrets.UAT_SELLER_EMAIL }}
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_TEST_PASSWORD: ${{ secrets.UAT_TEST_PASSWORD }}
      UAT_QR_CODE: ${{ secrets.UAT_QR_CODE }}
      UAT_VIDEO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify required UAT capture secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          required_secrets=(
            UAT_USER_EMAIL
            UAT_SELLER_EMAIL
            UAT_ADMIN_EMAIL
            UAT_TEST_PASSWORD
            UAT_QR_CODE
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            echo "::error::Required UAT capture secret names are missing: ${missing_secrets[*]}"
            exit 1
          fi

          case "${UAT_USER_EMAIL,,}" in
            *@antifake.local) ;;
            *) echo "::error::UAT_USER_EMAIL must use the approved synthetic domain"; exit 1 ;;
          esac
          case "${UAT_SELLER_EMAIL,,}" in
            *@antifake.local) ;;
            *) echo "::error::UAT_SELLER_EMAIL must use the approved synthetic domain"; exit 1 ;;
          esac
          case "${UAT_ADMIN_EMAIL,,}" in
            admin@antifake.io.vn|*@antifake.local) ;;
            *) echo "::error::UAT_ADMIN_EMAIL is not an approved UAT alias"; exit 1 ;;
          esac
          if ! [[ "${UAT_QR_CODE^^}" =~ ^UAT[-_][A-Z0-9_-]+$ ]]; then
            echo "::error::UAT_QR_CODE must use the synthetic UAT namespace"
            exit 1
          fi
          case "${UAT_TEST_PASSWORD,,}" in
            changeme|change-me|password|example|test)
              echo "::error::UAT_TEST_PASSWORD is still a placeholder"
              exit 1
              ;;
          esac

          echo "UAT capture secret preflight passed without printing secret values."
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture raw and temporary annotated pairs
        run: npm run test:e2e:uat:visual
      - name: Upload capture artifacts for privacy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antifake-uat-visual-captures
          path: .uat-runtime/test-results
          if-no-files-found: warn
          retention-days: 7
