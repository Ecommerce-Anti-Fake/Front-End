name: UAT demo visual capture

on:
  workflow_dispatch:
  push:
    branches:
      - uat-capture

permissions:
  contents: read

concurrency:
  group: antifake-uat-visual-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture UAT demo fixture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    env:
      ANTIFAKE_CURRENT_ENVIRONMENT: UAT_DEMO
      UAT_APPROVED_PUBLIC_HOSTS: antifake.io.vn,www.antifake.io.vn
      UAT_BASE_URL: https://antifake.io.vn
      UAT_FIXTURE_SMOKE: "true"
      UAT_USER_EMAIL: ${{ secrets.UAT_USER_EMAIL }}
      UAT_SELLER_EMAIL: ${{ secrets.UAT_SELLER_EMAIL }}
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_TEST_PASSWORD: ${{ secrets.UAT_TEST_PASSWORD }}
      UAT_QR_CODE: ${{ secrets.UAT_QR_CODE }}
      UAT_VIDEO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify required UAT capture secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .uat-runtime
          preflight_status=.uat-runtime/capture-preflight-status

          required_secrets=(
            UAT_USER_EMAIL
            UAT_SELLER_EMAIL
            UAT_ADMIN_EMAIL
            UAT_TEST_PASSWORD
            UAT_QR_CODE
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("$secret_name")
            fi
          done

          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            echo "::warning::Authenticated capture inputs are incomplete; public and independently configured role captures will still run. Missing names: ${missing_secrets[*]}"
            echo incomplete > "$preflight_status"
          else
            echo complete > "$preflight_status"
          fi

          if [ -n "${UAT_USER_EMAIL:-}" ]; then
            case "${UAT_USER_EMAIL,,}" in
              *@antifake.local) ;;
              *) echo "::error::UAT_USER_EMAIL must use the approved synthetic domain"; exit 1 ;;
            esac
          fi
          if [ -n "${UAT_SELLER_EMAIL:-}" ]; then
            case "${UAT_SELLER_EMAIL,,}" in
              *@antifake.local) ;;
              *) echo "::error::UAT_SELLER_EMAIL must use the approved synthetic domain"; exit 1 ;;
            esac
          fi
          if [ -n "${UAT_ADMIN_EMAIL:-}" ]; then
            case "${UAT_ADMIN_EMAIL,,}" in
              admin@antifake.io.vn|*@antifake.local) ;;
              *) echo "::error::UAT_ADMIN_EMAIL is not an approved UAT alias"; exit 1 ;;
            esac
          fi
          if [ -n "${UAT_QR_CODE:-}" ] && ! [[ "${UAT_QR_CODE^^}" =~ ^UAT[-_][A-Z0-9_-]+$ ]]; then
            echo "::error::UAT_QR_CODE must use the synthetic UAT namespace"
            exit 1
          fi
          if [ -n "${UAT_TEST_PASSWORD:-}" ]; then
            case "${UAT_TEST_PASSWORD,,}" in
              changeme|change-me|password|example|test)
                echo "::error::UAT_TEST_PASSWORD is still a placeholder"
                exit 1
                ;;
            esac
          fi

          echo "UAT capture input preflight completed without printing secret values."
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture raw and temporary annotated pairs
        run: npm run test:e2e:uat:visual
      - name: Require complete authenticated capture inputs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$(cat .uat-runtime/capture-preflight-status 2>/dev/null || echo incomplete)" != "complete" ]; then
            echo "::error::Authenticated UAT capture remains incomplete; configure the missing GitHub environment secrets and rerun. Secret values are not printed."
            exit 1
          fi
      - name: Upload capture artifacts for privacy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antifake-uat-visual-captures
          path: .uat-runtime/test-results
          if-no-files-found: warn
          retention-days: 7
