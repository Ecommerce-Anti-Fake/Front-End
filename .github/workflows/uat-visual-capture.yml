name: UAT demo visual capture

on:
  workflow_dispatch:
  push:
    branches:
      - uat-capture

permissions:
  contents: read

concurrency:
  group: antifake-uat-visual-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture UAT demo fixture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: uat
    env:
      ANTIFAKE_CURRENT_ENVIRONMENT: UAT_DEMO
      UAT_APPROVED_PUBLIC_HOSTS: antifake.io.vn,www.antifake.io.vn
      UAT_BASE_URL: https://antifake.io.vn
      UAT_FIXTURE_SMOKE: "true"
      ANTIFAKE_UAT_BUYER_EMAIL: ${{ secrets.ANTIFAKE_UAT_BUYER_EMAIL }}
      ANTIFAKE_UAT_BUYER_PASSWORD: ${{ secrets.ANTIFAKE_UAT_BUYER_PASSWORD }}
      ANTIFAKE_UAT_SELLER_EMAIL: ${{ secrets.ANTIFAKE_UAT_SELLER_EMAIL }}
      ANTIFAKE_UAT_SELLER_PASSWORD: ${{ secrets.ANTIFAKE_UAT_SELLER_PASSWORD }}
      ANTIFAKE_UAT_ADMIN_EMAIL: ${{ secrets.ANTIFAKE_UAT_ADMIN_EMAIL }}
      ANTIFAKE_UAT_ADMIN_PASSWORD: ${{ secrets.ANTIFAKE_UAT_ADMIN_PASSWORD }}
      UAT_QR_CODE: ${{ secrets.UAT_QR_CODE }}
      UAT_VIDEO: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify required UAT capture secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p .uat-runtime
          preflight_status=.uat-runtime/capture-preflight-status

          credential_available() {
            local email_name="$1"
            local password_name="$2"
            if [ -n "${!email_name:-}" ] && [ -n "${!password_name:-}" ]; then
              echo true
            else
              echo false
            fi
          }

          buyer_available="$(credential_available ANTIFAKE_UAT_BUYER_EMAIL ANTIFAKE_UAT_BUYER_PASSWORD)"
          seller_available="$(credential_available ANTIFAKE_UAT_SELLER_EMAIL ANTIFAKE_UAT_SELLER_PASSWORD)"
          admin_available="$(credential_available ANTIFAKE_UAT_ADMIN_EMAIL ANTIFAKE_UAT_ADMIN_PASSWORD)"
          echo "BUYER_CREDENTIAL_AVAILABLE=$buyer_available"
          echo "SELLER_CREDENTIAL_AVAILABLE=$seller_available"
          echo "ADMIN_CREDENTIAL_AVAILABLE=$admin_available"

          if [ "$buyer_available" = true ] && [ "$seller_available" = true ] && [ "$admin_available" = true ]; then
            echo complete > "$preflight_status"
          else
            echo partial > "$preflight_status"
            echo "::warning::One or more authenticated UAT role inputs are unavailable; available roles and public fixture captures will still run."
          fi

          if [ -n "${ANTIFAKE_UAT_BUYER_EMAIL:-}" ]; then
            case "${ANTIFAKE_UAT_BUYER_EMAIL,,}" in
              *@antifake.local) ;;
              *) echo "::error::Buyer UAT credential must use the approved synthetic domain"; exit 1 ;;
            esac
          fi
          if [ -n "${ANTIFAKE_UAT_SELLER_EMAIL:-}" ]; then
            case "${ANTIFAKE_UAT_SELLER_EMAIL,,}" in
              *@antifake.local) ;;
              *) echo "::error::Seller UAT credential must use the approved synthetic domain"; exit 1 ;;
            esac
          fi
          if [ -n "${ANTIFAKE_UAT_ADMIN_EMAIL:-}" ]; then
            case "${ANTIFAKE_UAT_ADMIN_EMAIL,,}" in
              admin@antifake.io.vn|*@antifake.local) ;;
              *) echo "::error::Admin UAT credential is not an approved UAT alias"; exit 1 ;;
            esac
          fi
          for password_name in \
            ANTIFAKE_UAT_BUYER_PASSWORD \
            ANTIFAKE_UAT_SELLER_PASSWORD \
            ANTIFAKE_UAT_ADMIN_PASSWORD; do
            password_value="${!password_name:-}"
            case "${password_value,,}" in
              changeme|change-me|password|example|test)
                echo "::error::A UAT role password is still a placeholder"
                exit 1
                ;;
            esac
          done
          if [ -n "${UAT_QR_CODE:-}" ] && ! [[ "${UAT_QR_CODE^^}" =~ ^UAT[-_][A-Z0-9_-]+$ ]]; then
            echo "::error::UAT_QR_CODE must use the synthetic UAT namespace"
            exit 1
          fi
          echo "UAT capture input preflight completed without printing secret values."
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture raw and temporary annotated pairs
        run: npm run test:e2e:uat:visual
      - name: Report authenticated capture input status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(cat .uat-runtime/capture-preflight-status 2>/dev/null || echo unavailable)"
          echo "AUTHENTICATED_CAPTURE_INPUT_STATUS=$status"
          echo "Authenticated UAT capture status reported without printing secret values."
      - name: Upload capture artifacts for privacy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antifake-uat-visual-captures
          path: .uat-runtime/test-results
          if-no-files-found: warn
          retention-days: 7
