name: UAT browser fixture smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antifake-uat-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    name: Verify UAT demo fixtures in isolated browsers
    runs-on: ubuntu-latest
    environment: uat
    env:
      ANTIFAKE_CURRENT_ENVIRONMENT: UAT_DEMO
      UAT_APPROVED_PUBLIC_HOSTS: antifake.io.vn,www.antifake.io.vn
      UAT_BASE_URL: https://antifake.io.vn
      UAT_FIXTURE_SMOKE: "true"
      ANTIFAKE_UAT_BUYER_EMAIL: ${{ secrets.ANTIFAKE_UAT_BUYER_EMAIL }}
      ANTIFAKE_UAT_BUYER_PASSWORD: ${{ secrets.ANTIFAKE_UAT_BUYER_PASSWORD }}
      ANTIFAKE_UAT_SELLER_EMAIL: ${{ secrets.ANTIFAKE_UAT_SELLER_EMAIL }}
      ANTIFAKE_UAT_SELLER_PASSWORD: ${{ secrets.ANTIFAKE_UAT_SELLER_PASSWORD }}
      ANTIFAKE_UAT_ADMIN_EMAIL: ${{ secrets.ANTIFAKE_UAT_ADMIN_EMAIL }}
      ANTIFAKE_UAT_ADMIN_PASSWORD: ${{ secrets.ANTIFAKE_UAT_ADMIN_PASSWORD }}
      UAT_QR_CODE: ${{ secrets.UAT_QR_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UAT fixture smoke
        run: npx playwright test --config=playwright.uat.config.ts e2e/uat-fixture-smoke.spec.ts e2e/uat-auth-storage-state.spec.ts --project=desktop --project=mobile
