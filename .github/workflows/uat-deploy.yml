name: Deploy frontend to isolated UAT

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy on the already provisioned UAT host
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: antifake-frontend-uat-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend UAT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: uat
    env:
      UAT_APP_DIR: ${{ vars.UAT_FRONTEND_APP_DIR }}
      UAT_ENV_FILE: ${{ vars.UAT_FRONTEND_ENV_FILE }}
      UAT_HEALTH_URL: ${{ vars.UAT_FRONTEND_HEALTH_URL }}
      UAT_HOST_MARKER_PATH: ${{ vars.UAT_HOST_MARKER_PATH }}
      UAT_REF: ${{ inputs.ref }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.UAT_VPS_HOST }}
          username: ${{ secrets.UAT_VPS_USER }}
          key: ${{ secrets.UAT_VPS_SSH_KEY }}
          port: ${{ secrets.UAT_VPS_PORT }}
          command_timeout: 30m
          envs: UAT_APP_DIR,UAT_ENV_FILE,UAT_HEALTH_URL,UAT_HOST_MARKER_PATH,UAT_REF
          script: |
            set -Eeuo pipefail
            shopt -s nocasematch

            : "${UAT_APP_DIR:?UAT_FRONTEND_APP_DIR is required}"
            : "${UAT_ENV_FILE:?UAT_FRONTEND_ENV_FILE is required}"
            : "${UAT_HEALTH_URL:?UAT_FRONTEND_HEALTH_URL is required}"
            : "${UAT_REF:?workflow ref is required}"

            MARKER_PATH="${UAT_HOST_MARKER_PATH:-/etc/antifake/uat-target}"
            if [ ! -r "$MARKER_PATH" ] || [ "$(tr -d '\r\n' < "$MARKER_PATH")" != "antifake-uat" ]; then
              echo "ERROR: remote host is not marked as antifake-uat."
              exit 1
            fi

            case "$UAT_REF" in
              -*|*..*|*[!A-Za-z0-9._/-]*)
                echo "ERROR: UAT ref contains unsafe characters."
                exit 1
                ;;
            esac

            case "$UAT_APP_DIR" in
              *production*|*/var/www/antifake/frontend|*/antifake/frontend)
                echo "ERROR: UAT frontend path looks like the production path."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: UAT frontend path must identify an isolated target."
                exit 1
                ;;
            esac

            case "$UAT_ENV_FILE" in
              *production*)
                echo "ERROR: UAT environment file looks production-scoped."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: UAT environment file must identify an isolated target."
                exit 1
                ;;
            esac

            case "$UAT_HEALTH_URL" in
              http://127.0.0.1:*|http://localhost:*|https://uat.*|https://staging.*|https://*-uat.*|https://*-staging.*|https://*.uat.*|https://*.staging.*|https://*.test.*) ;;
              *)
                echo "ERROR: UAT health URL is not an explicitly non-production URL."
                exit 1
                ;;
            esac

            cd "$UAT_APP_DIR"

            APP_REALPATH="$(pwd -P)"
            case "$APP_REALPATH" in
              *production*|*/var/www/antifake/frontend|*/antifake/frontend)
                echo "ERROR: resolved UAT frontend path is production-scoped."
                exit 1
                ;;
              *uat*|*staging*|*test*) ;;
              *)
                echo "ERROR: resolved UAT frontend path is not isolated."
                exit 1
                ;;
            esac

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: UAT frontend checkout has uncommitted changes."
              exit 1
            fi

            git fetch origin "$UAT_REF"
            git checkout "$UAT_REF"
            git pull --ff-only origin "$UAT_REF"

            if [ ! -r "$UAT_ENV_FILE" ]; then
              echo "ERROR: UAT environment file is not readable on the host."
              exit 1
            fi

            ENV_REALPATH="$(realpath -e "$UAT_ENV_FILE")"
            case "$ENV_REALPATH" in
              *production*)
                echo "ERROR: resolved UAT environment file is production-scoped."
                exit 1
                ;;
            esac

            set -a
            . "$UAT_ENV_FILE"
            set +a

            case "${VITE_API_BASE_URL:-}" in
              http://127.0.0.1:*|http://localhost:*|https://uat.*|https://staging.*|https://*-uat.*|https://*-staging.*|https://*.uat.*|https://*.staging.*|https://*.test.*) ;;
              *)
                echo "ERROR: VITE_API_BASE_URL is not an explicitly non-production URL."
                exit 1
                ;;
            esac

            RUNTIME_DIR="$UAT_APP_DIR/.uat-runtime"
            DIST_DIR="$UAT_APP_DIR/dist"
            BACKUP_DIR="$RUNTIME_DIR/dist-previous"
            mkdir -p "$RUNTIME_DIR"
            BUILD_DIR="$(mktemp -d "$RUNTIME_DIR/dist-new.XXXXXX")"

            rollback() {
              exit_code=$?
              trap - ERR
              set +e
              rm -rf "$BUILD_DIR"
              rm -rf "$DIST_DIR"
              if [ -e "$BACKUP_DIR" ]; then
                mv "$BACKUP_DIR" "$DIST_DIR"
                nginx -t && systemctl reload nginx
              fi
              exit "$exit_code"
            }
            trap rollback ERR

            npm ci
            npm run build -- --mode uat --outDir "$BUILD_DIR"
            test -f "$BUILD_DIR/index.html"

            if [ -e "$BACKUP_DIR" ]; then
              rm -rf "$BACKUP_DIR"
            fi
            if [ -e "$DIST_DIR" ]; then
              mv "$DIST_DIR" "$BACKUP_DIR"
            fi
            mv "$BUILD_DIR" "$DIST_DIR"

            nginx -t
            systemctl reload nginx
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 15 \
              --retry-delay 3 \
              --retry-all-errors \
              --header "Cache-Control: no-cache" \
              "$UAT_HEALTH_URL" \
              > /dev/null

            rm -rf "$BACKUP_DIR"
            trap - ERR
            echo "Frontend UAT deployment completed: $(git rev-parse HEAD)"
