name: Deploy frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: antifake-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: |
          echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/antifake/frontend"
            DIST_DIR="$APP_DIR/dist"
            BACKUP_DIR="$APP_DIR/dist.previous"
            HEALTH_URL="https://antifake.io.vn"

            cd "$APP_DIR"

            echo "========================================"
            echo "1. Kiểm tra repository"
            echo "========================================"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Repository frontend trên VPS có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "Commit hiện tại: $PREVIOUS_COMMIT"

            rollback() {
              EXIT_CODE=$?

              # Ngăn rollback bị gọi lại nếu chính quá trình rollback gặp lỗi.
              trap - ERR
              set +e

              echo "========================================"
              echo "Deploy thất bại, bắt đầu rollback"
              echo "========================================"

              cd "$APP_DIR"

              echo "Khôi phục source code về commit: $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"

              if [ -d "$BACKUP_DIR" ]; then
                echo "Khôi phục thư mục dist trước đó."

                rm -rf "$DIST_DIR"
                mv "$BACKUP_DIR" "$DIST_DIR"
              else
                echo "WARNING: Không tìm thấy bản sao lưu dist.previous."
              fi

              echo "Kiểm tra cấu hình Nginx."

              if nginx -t; then
                echo "Reload Nginx."
                systemctl reload nginx
              else
                echo "ERROR: Cấu hình Nginx không hợp lệ khi rollback."
              fi

              echo "========================================"
              echo "Rollback frontend hoàn tất."
              echo "========================================"

              exit "$EXIT_CODE"
            }

            trap rollback ERR

            echo "========================================"
            echo "2. Lấy source code mới"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            NEW_COMMIT="$(git rev-parse HEAD)"
            echo "Commit mới: $NEW_COMMIT"

            echo "========================================"
            echo "3. Cài dependencies"
            echo "========================================"

            npm ci

            echo "========================================"
            echo "4. Sao lưu bản build hiện tại"
            echo "========================================"

            rm -rf "$BACKUP_DIR"

            if [ -d "$DIST_DIR" ]; then
              cp -a "$DIST_DIR" "$BACKUP_DIR"
              echo "Đã sao lưu dist vào dist.previous."
            else
              echo "Chưa có thư mục dist cũ để sao lưu."
            fi

            echo "========================================"
            echo "5. Build frontend"
            echo "========================================"

            npm run build

            if [ ! -d "$DIST_DIR" ]; then
              echo "ERROR: Build hoàn tất nhưng không tìm thấy thư mục dist."
              exit 1
            fi

            if [ ! -f "$DIST_DIR/index.html" ]; then
              echo "ERROR: Không tìm thấy dist/index.html."
              exit 1
            fi

            echo "========================================"
            echo "6. Kiểm tra và reload Nginx"
            echo "========================================"

            nginx -t
            systemctl reload nginx

            echo "========================================"
            echo "7. Health check"
            echo "========================================"

            sleep 3

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              --header "Cache-Control: no-cache" \
              "$HEALTH_URL" \
              > /dev/null

            echo "Health check thành công."

            # Xóa bản backup sau khi deploy và health check thành công.
            rm -rf "$BACKUP_DIR"

            # Tắt rollback vì quá trình deploy đã hoàn tất.
            trap - ERR

            echo "========================================"
            echo "Frontend deployment completed successfully."
            echo "Commit: $NEW_COMMIT"
            echo "========================================"

      - name: Telegram - frontend deploy notification
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}

          DEPLOY_START: ${{ steps.deploy_start.outputs.timestamp }}
          JOB_STATUS: ${{ job.status }}

        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          echo "Job status: ${JOB_STATUS}"

          END_TIME="$(date +%s)"

          if [ -n "${DEPLOY_START:-}" ]; then
            TOTAL_SECONDS=$((END_TIME - DEPLOY_START))
          else
            TOTAL_SECONDS=0
          fi

          if [ "$TOTAL_SECONDS" -lt 0 ]; then
            TOTAL_SECONDS=0
          fi

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          else
            DEPLOY_TIME="${SECONDS}s"
          fi

          # Khi chạy workflow_dispatch có thể không có head_commit.message.
          if [ -z "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công"
          fi

          case "$JOB_STATUS" in
            success)
              TITLE="🎨 AntiFake Frontend Deploy Thành Công"
              TIME_LABEL="Thời gian deploy"

              RESULT_MESSAGE="$(printf '%s\n' \
                '🟢 Deploy: SUCCESS' \
                '🟢 Health Check: PASSED' \
                '🔗 Website: https://antifake.io.vn')"
              ;;

            failure)
              TITLE="❌ AntiFake Frontend Deploy Thất Bại"
              TIME_LABEL="Thời gian chạy"

              RESULT_MESSAGE="$(printf '%s\n' \
                '🔴 Deploy: FAILED' \
                '🟡 Rollback: Kiểm tra log để xác nhận kết quả rollback')"
              ;;

            cancelled)
              TITLE="⚠️ AntiFake Frontend Deploy Đã Bị Hủy"
              TIME_LABEL="Thời gian chạy"

              RESULT_MESSAGE="$(printf '%s\n' \
                '🟠 Deploy: CANCELLED' \
                'ℹ️ Kiểm tra log để xác định trạng thái website')"
              ;;

            *)
              TITLE="⚠️ AntiFake Frontend Deploy Có Trạng Thái Không Xác Định"
              TIME_LABEL="Thời gian chạy"
              RESULT_MESSAGE="🟠 Trạng thái: ${JOB_STATUS}"
              ;;
          esac

          MESSAGE="$(printf '%s\n' \
            "${TITLE}" \
            "" \
            "🌐 Môi trường: Production" \
            "📦 Repository: ${REPOSITORY}" \
            "🌿 Branch: ${BRANCH}" \
            "" \
            "🔖 Commit:" \
            "${SHORT_SHA} - ${COMMIT_MESSAGE}" \
            "" \
            "👤 Người thực hiện: ${ACTOR}" \
            "🚀 Workflow: ${WORKFLOW}" \
            "🔢 Run: #${RUN_NUMBER}" \
            "⏱️ ${TIME_LABEL}: ${DEPLOY_TIME}" \
            "" \
            "${RESULT_MESSAGE}" \
            "" \
            "Chi tiết:" \
            "${RUN_URL}")"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null