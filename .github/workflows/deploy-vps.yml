name: Deploy frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: antifake-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_DIR="/var/www/antifake/frontend"
            DIST_DIR="$APP_DIR/dist"
            BACKUP_DIR="$APP_DIR/dist.previous"
            HEALTH_URL="https://antifake.io.vn"

            cd "$APP_DIR"

            echo "========================================"
            echo "1. Kiểm tra repository"
            echo "========================================"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: Repository frontend trên VPS có thay đổi chưa commit."
              git status --short
              exit 1
            fi

            PREVIOUS_COMMIT="$(git rev-parse HEAD)"
            echo "Commit hiện tại: $PREVIOUS_COMMIT"

            rollback() {
              EXIT_CODE=$?

              # Ngăn hàm rollback tự kích hoạt lại khi chính rollback gặp lỗi.
              trap - ERR
              set +e

              echo "========================================"
              echo "Deploy thất bại, bắt đầu rollback"
              echo "========================================"

              cd "$APP_DIR"

              echo "Khôi phục source code về: $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"

              if [ -d "$BACKUP_DIR" ]; then
                echo "Khôi phục thư mục dist trước đó."
                rm -rf "$DIST_DIR"
                mv "$BACKUP_DIR" "$DIST_DIR"
              else
                echo "WARNING: Không tìm thấy bản sao lưu dist.previous."
              fi

              echo "Kiểm tra và reload Nginx."
              nginx -t
              systemctl reload nginx

              echo "Rollback frontend hoàn tất."
              exit "$EXIT_CODE"
            }

            trap rollback ERR

            echo "========================================"
            echo "2. Lấy source code mới"
            echo "========================================"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            NEW_COMMIT="$(git rev-parse HEAD)"
            echo "Commit mới: $NEW_COMMIT"

            echo "========================================"
            echo "3. Cài dependencies"
            echo "========================================"

            npm ci

            echo "========================================"
            echo "4. Sao lưu bản build hiện tại"
            echo "========================================"

            rm -rf "$BACKUP_DIR"

            if [ -d "$DIST_DIR" ]; then
              cp -a "$DIST_DIR" "$BACKUP_DIR"
              echo "Đã sao lưu dist vào dist.previous."
            else
              echo "Chưa có thư mục dist cũ để sao lưu."
            fi

            echo "========================================"
            echo "5. Build frontend"
            echo "========================================"

            npm run build

            if [ ! -d "$DIST_DIR" ]; then
              echo "ERROR: Build hoàn tất nhưng không tìm thấy thư mục dist."
              exit 1
            fi

            if [ ! -f "$DIST_DIR/index.html" ]; then
              echo "ERROR: Không tìm thấy dist/index.html."
              exit 1
            fi

            echo "========================================"
            echo "6. Kiểm tra Nginx"
            echo "========================================"

            nginx -t
            systemctl reload nginx

            echo "========================================"
            echo "7. Health check"
            echo "========================================"

            sleep 3

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 10 \
              --retry-delay 3 \
              --retry-all-errors \
              --header "Cache-Control: no-cache" \
              "$HEALTH_URL" \
              > /dev/null

            echo "Health check thành công."

            rm -rf "$BACKUP_DIR"
            trap - ERR

            echo "========================================"
            echo "Frontend deployment completed successfully."
            echo "Commit: $NEW_COMMIT"
            echo "========================================"

      - name: Telegram - frontend deploy success
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          START_TIME=$(date -d "$RUN_STARTED_AT" +%s)
          END_TIME=$(date +%s)
          TOTAL_SECONDS=$((END_TIME - START_TIME))

          MINUTES=$((TOTAL_SECONDS / 60))
          SECONDS=$((TOTAL_SECONDS % 60))
          DEPLOY_TIME="${MINUTES}m ${SECONDS}s"

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công hoặc không có nội dung commit"
          fi

          MESSAGE=$(cat <<EOF
          🎨 AntiFake Frontend Deploy Thành Công

          🌐 Môi trường: Production

          📦 Repository: ${REPOSITORY}
          🌿 Branch: ${BRANCH}

          🔖 Commit:
          ${SHORT_SHA} - ${COMMIT_MESSAGE}

          👤 Người thực hiện: ${ACTOR}
          🚀 Workflow: ${WORKFLOW}
          🔢 Run: #${RUN_NUMBER}
          ⏱️ Thời gian deploy: ${DEPLOY_TIME}

          🟢 Health Check: PASSED
          🔗 Website: https://antifake.io.vn

          Chi tiết:
          ${RUN_URL}
          EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null

      - name: Telegram - frontend deploy failed
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          START_TIME=$(date -d "$RUN_STARTED_AT" +%s)
          END_TIME=$(date +%s)
          TOTAL_SECONDS=$((END_TIME - START_TIME))

          MINUTES=$((TOTAL_SECONDS / 60))
          SECONDS=$((TOTAL_SECONDS % 60))
          DEPLOY_TIME="${MINUTES}m ${SECONDS}s"

          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công hoặc không có nội dung commit"
          fi

          MESSAGE=$(cat <<EOF
          ❌ AntiFake Frontend Deploy Thất Bại

          🌐 Môi trường: Production

          📦 Repository: ${REPOSITORY}
          🌿 Branch: ${BRANCH}

          🔖 Commit:
          ${SHORT_SHA} - ${COMMIT_MESSAGE}

          👤 Người thực hiện: ${ACTOR}
          🚀 Workflow: ${WORKFLOW}
          🔢 Run: #${RUN_NUMBER}
          ⏱️ Thời gian chạy: ${DEPLOY_TIME}

          🔴 Deploy: FAILED
          🟡 Rollback: Đã kích hoạt quy trình rollback

          Kiểm tra log:
          ${RUN_URL}
          EOF
          )

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null